name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[pdf]'

      - name: Run tests
        env:
          LAW_RAG_LLM_PROVIDER: deterministic
        run: python -m pytest -q

      - name: Verify optional LangChain adapter
        run: |
          python -m pip install -e '.[langchain]'
          python -m pytest -q tests/test_langchain_adapter.py

      - name: Run regression evaluation
        env:
          LAW_RAG_LLM_PROVIDER: deterministic
        run: |
          python -m law_rag.evaluation \
            --dataset evaluation/datasets/official_core_cases.json \
            --output evaluation/reports/ci-official.json \
            --no-log-failures \
            --fail-under 0.60

      - name: Run retrieval benchmark regression
        run: |
          python -m tools.run_retrieval_benchmark \
            --methods bm25 semantic_lite hybrid \
            --output evaluation/benchmarks/ci-retrieval.json \
            --fail-under-hit-at-k 0.60 \
            --fail-under-mrr 0.45

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag law-rag-qa-planner:ci .

      - name: Start container
        run: |
          docker run --detach --rm \
            --name law-rag-ci \
            --publish 8000:8000 \
            --env LAW_RAG_LLM_PROVIDER=deterministic \
            law-rag-qa-planner:ci

      - name: Wait for health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs law-rag-ci
          exit 1

      - name: Smoke-test answer endpoint
        run: |
          curl --fail --silent \
            --request POST http://127.0.0.1:8000/answer \
            --header 'Content-Type: application/json' \
            --data '{"question":"개인정보 수집 동의 요건은?","domain":"digital_business","top_k":1}' \
            | python -m json.tool

      - name: Print container logs on failure
        if: failure()
        run: docker logs law-rag-ci || true
