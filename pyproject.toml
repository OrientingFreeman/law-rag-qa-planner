[project]
name = "law-rag-qa-planner"
version = "4.27.6"
description = "Domain-extensible Korean law retrieval and grounded QA planner"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=1.0,<2.0"]
ml = ["sentence-transformers>=3.0,<6.0"]
pdf = ["pypdf>=5.0,<7.0", "reportlab>=4.0,<5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
